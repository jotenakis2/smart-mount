name: package

# Construit le paquet binaire, le signe et l'attache à la release publiée.
# Le paquet est arch=('any') : du bash et des pages de man, rien n'est compilé, donc
# un seul artefact vaut pour toutes les architectures. Ce workflow ne publie rien sur
# l'AUR (qui attend un PKGBUILD, pas un binaire).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à empaqueter (ex. v1.28)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dépendances de construction
        run: pacman -Syu --noconfirm --needed base-devel git github-cli gnupg shellcheck python curl

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # La suite tourne aussi ici : une release ne doit pas partir sur un arbre
      # cassé, même si check.yml est déjà passé sur le même commit.
      - name: Contrôles (syntaxe, style, tests)
        run: make check

      # La clé arrive par secrets. Elle sert uniquement à signer les paquets :
      # sa partie publique est dans le dépôt (packaging-key.asc), c'est elle que
      # les utilisateurs importent dans leur trousseau pacman.
      - name: Préparation de la clé de signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "secret GPG_PRIVATE_KEY absent : impossible de signer le paquet" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "${GPG_PRIVATE_KEY}" > /tmp/signing-key.asc
          printf '%s' "${GPG_PASSPHRASE}" > /tmp/signing-pass
          chmod 600 /tmp/signing-key.asc /tmp/signing-pass
          # la clé publique du dépôt doit correspondre à la clé privée fournie.
          # Un tag antérieur à la publication de la clé n'en contient pas : on
          # prend alors celle de la branche par défaut, c'est celle-là que les
          # utilisateurs importent.
          key_file=packaging-key.asc
          if [ ! -f "${key_file}" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/HEAD/packaging-key.asc" \
              -o "${key_file}"
          fi
          gpg --batch --import /tmp/signing-key.asc 2>/dev/null
          expected=$(gpg --batch --show-keys --with-colons "${key_file}" \
            | awk -F: '/^fpr/ {print $10; exit}')
          actual=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          if [ "${expected}" != "${actual}" ]; then
            echo "packaging-key.asc (${expected}) != clé fournie (${actual})" >&2
            exit 1
          fi
          echo "clé de signature : ${actual}"

      - name: Construction et signature
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -e
          # makepkg refuse de tourner en root : l'arbre est donné à un utilisateur
          # de construction, qui importe la clé dans SON trousseau.
          useradd -m builder
          # Même raison que pour la clé publique : un tag antérieur à ce workflow
          # ne contient pas le script de construction. Il est copié (ou récupéré
          # sur la branche par défaut) dans /tmp, qui existe toujours.
          script=/tmp/build-signed.sh
          if [ -f .github/scripts/build-signed.sh ]; then
            cp .github/scripts/build-signed.sh "${script}"
          else
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/HEAD/.github/scripts/build-signed.sh" \
              -o "${script}"
          fi
          chmod 755 "${script}"
          chown -R builder .
          install -o builder -g builder -m 600 /tmp/signing-key.asc /home/builder/signing-key.asc
          install -o builder -g builder -m 600 /tmp/signing-pass /home/builder/signing-pass
          runuser -u builder -- bash /tmp/build-signed.sh "${GPG_KEY_ID}"
          rm -f /tmp/signing-key.asc /tmp/signing-pass

      - name: Contrôle du paquet produit
        run: |
          set -e
          pkg=$(ls -1 smart-mount-*.pkg.tar.* | grep -v '\.sig$' | head -1)
          sig="${pkg}.sig"
          echo "paquet : $pkg"
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          echo "version attendue : $pkgver"

          [ -f "${sig}" ] || { echo "pas de signature : ${sig}" >&2; exit 1; }
          # la signature doit vérifier avec la clé publique du dépôt, seule clé
          # qu'un utilisateur aura importée (absente des tags antérieurs à sa
          # publication : repli sur la branche par défaut)
          key_file=packaging-key.asc
          if [ ! -f "${key_file}" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/HEAD/packaging-key.asc" \
              -o "${key_file}"
          fi
          gpg --batch --import "${key_file}" 2>/dev/null
          gpg --batch --verify "${sig}" "${pkg}"

          bsdtar tf "${pkg}" | sort > /tmp/contents
          for f in etc/NetworkManager/dispatcher.d/98-eth-nas-mac \
                   etc/NetworkManager/dispatcher.d/99-wifi-nas-mount \
                   etc/systemd/system/nas-network-check.service \
                   etc/systemd/system/nas-network-check.timer \
                   usr/bin/nas-smartmount.sh \
                   usr/share/man/man8/nas-smartmount.8.gz \
                   usr/share/man/fr/man8/nas-smartmount.8.gz; do
            grep -qx "$f" /tmp/contents || { echo "manquant dans le paquet : $f" >&2; exit 1; }
          done

          # Le binaire et les deux pages de man doivent annoncer la version du
          # PKGBUILD : elles étaient restées à 1.25 alors que le code était en 1.28.
          bsdtar xOf "${pkg}" usr/bin/nas-smartmount.sh \
            | grep -qx "VER=${pkgver}" \
            || { echo "VER du binaire != ${pkgver}" >&2; exit 1; }
          for lang in usr/share/man/man8/nas-smartmount.8.gz \
                      usr/share/man/fr/man8/nas-smartmount.8.gz; do
            bsdtar xOf "${pkg}" "$lang" | gzip -dc | grep -q "\"smart-mount ${pkgver}\"" \
              || { echo "page de man pas à ${pkgver} : ${lang}" >&2; exit 1; }
          done
          echo "contenu, versions et signature conformes"

      - name: Attachement à la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${{ inputs.tag || github.ref_name }}"
          # L'arbre appartient à l'utilisateur de construction : gh n'a pas besoin
          # de git ici (--repo), et on lève quand même la garde de propriété.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true
          gh release upload "$tag" smart-mount-*.pkg.tar.* --clobber --repo "${GITHUB_REPOSITORY}"
          gh release view "$tag" --json assets --jq '.assets[].name' --repo "${GITHUB_REPOSITORY}"

  # Paquets natifs deb et rpm, produits par nfpm depuis le même arbre que
  # `make install`. Le paquet pacman du job précédent reste le seul à être signé
  # par makepkg ; ici la signature est détachée (.sig), vérifiable avec la même
  # clé publique du dépôt.
  deb-rpm:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      NFPM_VERSION: "2.49.0"
    steps:
      - name: Dépendances
        run: pacman -Syu --noconfirm --needed base-devel git github-cli gnupg curl gzip

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Contrôles (syntaxe, style, tests)
        run: make check

      - name: nfpm (binaire épinglé, somme de contrôle vérifiée)
        run: |
          set -e
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "architecture non gérée : $(uname -m)" >&2; exit 1 ;;
          esac
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          name="nfpm_${NFPM_VERSION}_linux_${arch}.tar.gz"
          curl -fsSL -o "/tmp/${name}" "${base}/${name}"
          curl -fsSL -o /tmp/nfpm-checksums.txt "${base}/nfpm_${NFPM_VERSION}_checksums.txt"
          ( cd /tmp && grep " ${name}\$" nfpm-checksums.txt | sha256sum -c - )
          tar xzf "/tmp/${name}" -C /usr/local/bin nfpm
          nfpm --version | sed -n '4p'

      - name: Construction des paquets
        run: make packages

      - name: Signature détachée
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -e
          umask 077
          printf '%s\n' "${GPG_PRIVATE_KEY}" > /tmp/signing-key.asc
          printf '%s' "${GPG_PASSPHRASE}" > /tmp/signing-pass
          install -d -m 700 ~/.gnupg
          echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf
          echo 'pinentry-mode loopback' > ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent 2>/dev/null || true
          gpg --batch --import /tmp/signing-key.asc
          gpg --batch --pinentry-mode loopback --passphrase-file /tmp/signing-pass \
              --local-user "${GPG_KEY_ID}" --detach-sign -o /dev/null /dev/null
          for pkg in dist/*.deb dist/*.rpm; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-file /tmp/signing-pass \
                --local-user "${GPG_KEY_ID}" --armor --detach-sign "${pkg}"
            echo "signé : ${pkg}.asc"
          done
          rm -f /tmp/signing-key.asc /tmp/signing-pass

      - name: Contrôle du contenu
        run: |
          set -e
          deb=$(ls dist/*.deb); rpm=$(ls dist/*.rpm)
          echo "deb : $deb"; echo "rpm : $rpm"

          # rpm : libarchive lit la charge directement
          bsdtar tf "$rpm" | grep -q 'etc/NetworkManager/dispatcher.d/98-eth-nas-mac' \
            || { echo "hook absent du rpm" >&2; exit 1; }
          bsdtar tf "$rpm" | grep -q 'usr/share/man/fr/man8/nas-smartmount.8.gz' \
            || { echo "page de man FR absente du rpm" >&2; exit 1; }

          # deb : ar, puis l'archive de données
          member=$(ar t "$deb" | grep '^data\.tar' | head -1)
          ar p "$deb" "$member" | bsdtar tf - | grep -q 'usr/bin/nas-smartmount.sh' \
            || { echo "binaire absent du deb" >&2; exit 1; }
          ctrl=$(ar t "$deb" | grep '^control\.tar' | head -1)
          control=$(ar p "$deb" "$ctrl" | bsdtar xOf - ./control)
          for dep in nfs-common network-manager iputils-ping whiptail; do
            printf '%s' "$control" | grep -q "$dep" \
              || { echo "dépendance deb manquante : $dep" >&2; exit 1; }
          done
          # la charge rpm doit nommer les paquets de sa famille
          for dep in nfs-utils NetworkManager iputils newt; do
            strings "$rpm" | grep -qx "$dep" \
              || { echo "dépendance rpm manquante : $dep" >&2; exit 1; }
          done

          # le binaire et les pages de man annoncent la version du PKGBUILD
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          ar p "$deb" "$member" | bsdtar xOf - ./usr/bin/nas-smartmount.sh | grep -qx "VER=${pkgver}" \
            || { echo "VER du binaire deb != ${pkgver}" >&2; exit 1; }

          # signatures
          for f in "$deb" "$rpm"; do
            [ -f "${f}.asc" ] || { echo "signature absente : ${f}.asc" >&2; exit 1; }
            gpg --batch --verify "${f}.asc" "${f}"
          done
          echo "contenu, dépendances et signatures conformes"

      - name: Attachement à la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${{ inputs.tag || github.ref_name }}"
          gh release upload "$tag" dist/*.deb dist/*.rpm dist/*.deb.asc dist/*.rpm.asc \
            --clobber --repo "${GITHUB_REPOSITORY}"
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'
